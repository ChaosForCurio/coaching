<VirtualHost *:80>
    ServerName www.bhavyacomputerclasses.com
    ServerAlias bhavyacomputerclasses.com

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.bhavyacomputerclasses.com
    ServerAlias bhavyacomputerclasses.com

    # ---------------------------------------------------------
    # SSL Configuration (assuming Let's Encrypt / Certbot)
    # ---------------------------------------------------------
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/bhavyacomputerclasses.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bhavyacomputerclasses.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # ---------------------------------------------------------
    # Security Headers
    # ---------------------------------------------------------
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ---------------------------------------------------------
    # GZIP / Deflate Compression
    # ---------------------------------------------------------
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript
        AddOutputFilterByType DEFLATE application/javascript application/x-javascript application/json
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # ---------------------------------------------------------
    # Reverse Proxy to Astro / Node.js Server
    # ---------------------------------------------------------
    # Enable proxying
    ProxyPreserveHost On
    ProxyRequests Off

    # Proxy all traffic to the Node.js application running on port 4321
    # Change port 4321 if your production Node.js server runs on a different port (e.g., 3000)
    ProxyPass / http://127.0.0.1:4321/
    ProxyPassReverse / http://127.0.0.1:4321/

    # ---------------------------------------------------------
    # Logging
    # ---------------------------------------------------------
    ErrorLog ${APACHE_LOG_DIR}/bhavyacomputerclasses_error.log
    CustomLog ${APACHE_LOG_DIR}/bhavyacomputerclasses_access.log combined

</VirtualHost>
